<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pets · Angels Online wiki</title>
<style>
  :root{--bg:#100c1c;--bg-deep:#0b0814;--panel:#1b1530;--panel2:#231b3d;--line:#3a2f5c;--gold:#d7b15a;--gold-strong:#f0d48a;--ink-on-gold:#1a1208;--muted:#a49cc0;--text:#ece6ff;--accent:#8fd0ff;--warn:#ffb36b}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1100px 480px at 8% -10%,rgba(92,58,150,.45),transparent 55%),var(--bg);min-height:100vh}
  button,input,select{font:inherit;color:inherit}
  button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer}
  button:hover{border-color:var(--gold)}
  button:disabled{opacity:.35;cursor:default}
  button[aria-pressed="true"]{background:linear-gradient(180deg,#f0d48a,#d7b15a);color:var(--ink-on-gold);border-color:#f0d48a;font-weight:700}
  header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 18px;background:rgba(16,12,28,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  header h1{font-size:18px;margin:0;color:var(--gold-strong);letter-spacing:.04em}
  header h1 small{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
  header a{color:var(--gold-strong);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px}
  header a:hover{border-color:var(--gold)}
  .seg{display:flex;gap:4px;flex-wrap:wrap}
  #q{flex:1;min-width:180px;max-width:340px;background:var(--bg-deep);border:1px solid var(--line);border-radius:10px;padding:7px 12px}
  .chk{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
  main{display:grid;grid-template-columns:200px 1fr 380px;gap:16px;padding:16px 18px;align-items:start}
  nav{position:sticky;top:70px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
  nav .h{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em;padding:8px 8px 4px}
  nav button{display:flex;justify-content:space-between;width:100%;text-align:left;margin:2px 0;border-color:transparent;background:none}
  nav button .n{color:var(--muted);font-size:12px}
  nav button[aria-pressed="true"] .n{color:var(--ink-on-gold)}
  .bar{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;color:var(--muted);gap:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
  .card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 6px 6px;cursor:pointer;text-align:center;transition:transform .08s}
  .card:hover{transform:translateY(-2px);border-color:var(--gold)}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .card.on{border-color:var(--gold-strong);box-shadow:0 0 0 2px rgba(240,212,138,.45)}
  .frame{width:88px;height:88px;margin:0 auto;display:grid;place-items:center;border-radius:6px;
    background:radial-gradient(circle at 50% 40%,#2e2550,#120d22 70%);
    border:2px solid #6b5527;box-shadow:inset 0 0 0 2px #1a1308,inset 0 0 0 3px #a8843d,0 2px 0 #000}
  .frame canvas{image-rendering:pixelated;display:block}
  .frame.loading{animation:pulse 1.2s ease-in-out infinite}
  .frame.none{border-style:dashed;border-color:#5a4a7a;box-shadow:none;color:var(--muted);font-size:10.5px;line-height:1.2}
  @keyframes pulse{50%{filter:brightness(1.35)}}
  .nm{font-size:11.5px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:30px}
  .id{color:var(--muted);font-size:10.5px}
  .badge{position:absolute;top:4px;left:4px;font-size:9.5px;padding:1px 5px;border-radius:6px;background:#203a52;color:#cfe8ff;border:1px solid #33618a}
  .badge.s4{background:#5a4210;color:#ffe9a8;border-color:#a8843d}
  .badge.r{left:auto;right:4px;background:#5a2a3a;color:#ffd0dc;border-color:#8a3a52}
  .badge.fu{top:22px;background:#3a2a5a;color:#e8d0ff;border-color:#7a5aaa}
  .pager{display:flex;gap:6px;align-items:center;justify-content:center;margin:14px 0}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  aside{position:sticky;top:70px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;max-height:calc(100vh - 84px);overflow:auto}
  #stage{width:100%;height:380px;display:block;border-radius:10px;image-rendering:pixelated;touch-action:none;background:#120e22;cursor:grab}
  #stage:focus-visible{outline:2px solid var(--accent)}
  .rot{display:grid;grid-template-columns:40px 1fr 40px;gap:6px;align-items:center;margin-top:8px;text-align:center;color:var(--gold-strong);font-weight:700}
  .strip{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:8px}
  .strip canvas{width:100%;aspect-ratio:1;background:#120e22;border:1px solid var(--line);border-radius:6px;image-rendering:pixelated;cursor:pointer}
  .strip canvas.on{border-color:var(--gold-strong);box-shadow:0 0 0 1px var(--gold-strong)}
  h2{margin:10px 0 2px;font-size:18px;color:var(--gold-strong)}
  .meta{color:var(--muted);font-size:12.5px}
  #vStatus{color:var(--accent);font-size:12px;min-height:16px;margin-top:4px}
  .warn{color:var(--warn);font-size:12px}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .row .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-right:2px}
  .row button{padding:4px 10px;font-size:13px}
  .callout{margin:10px 0;padding:10px;border-radius:10px;border:1px solid #7a5aaa;background:linear-gradient(180deg,#2a1f45,#1d1633);font-size:12.5px}
  .callout b{color:#e8d0ff}
  .callout.miss{border-color:#8a3a52;background:linear-gradient(180deg,#3a1f2b,#22141c)}
  .callout.miss b{color:#ffd0dc}
  .callout a{color:var(--gold-strong)}
  .mt{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(96px,1fr);gap:6px;overflow-x:auto;padding:4px 0 8px}
  .mt .col{display:flex;flex-direction:column;gap:4px;justify-content:center}
  .mt .col .h{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;text-align:center}
  .chip{display:block;width:100%;font-size:11px;padding:4px 6px;border-radius:8px;text-align:left;background:var(--bg-deep);border:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip.path{border-color:#a8843d}
  .chip.on{background:linear-gradient(180deg,#f0d48a,#d7b15a);color:var(--ink-on-gold);font-weight:700;border-color:#f0d48a}
  .chip.dim{opacity:.55}
  .branch{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
  .branch button{text-align:left;font-size:12px}
  .branch button small{display:block;color:var(--muted);font-size:10.5px}
  table{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:6px}
  td,th{border-bottom:1px solid var(--line);padding:3px 6px;text-align:right}
  td:first-child,th:first-child{text-align:left;color:var(--muted)}
  details summary{cursor:pointer;color:var(--accent);margin-top:10px}
  code{font-size:11.5px;color:var(--accent)}
  .kbd{color:var(--muted);font-size:11px;margin-top:6px}
  #boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--muted);z-index:20;font-size:15px}
  @media (max-width:1100px){main{grid-template-columns:170px 1fr}aside{grid-column:1/-1;position:static;max-height:none;order:-1}}
  @media (max-width:700px){main{grid-template-columns:1fr;padding:10px}nav{position:static;display:flex;flex-wrap:wrap;gap:4px}nav .h{display:none}nav button{width:auto;margin:0;gap:6px;border-color:var(--line)}
    header{gap:8px;padding:8px 10px}#q{max-width:none;flex-basis:100%}#stage{height:300px}.grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}}
</style>
</head>
<body>
<div id="boot">Loading pet data…</div>
<header>
  <h1>Pets <small>Angels Online · evolution viewer</small></h1>
  <a href="items.html">Item wiki</a>
  <a href="fashion.html">Wardrobe</a>
  <input id="q" type="search" placeholder="Search name or pet ID…" autocomplete="off">
  <label class="chk"><input type="checkbox" id="onlyEn"> English names only</label>
  <label class="chk"><input type="checkbox" id="onlySpr"> Has sprite</label>
  <label class="chk" title="Apply the game's BaseBias/MaskBias palette shift"><input type="checkbox" id="colour" checked> Game colours</label>
</header>
<main>
  <nav id="menu"></nav>
  <section>
    <div class="bar"><span id="count"></span><span id="colourNote" class="warn"></span></div>
    <div class="grid" id="grid"></div>
    <div class="pager"><button id="prev">◀ Prev</button><span id="page"></span><button id="next">Next ▶</button></div>
  </section>
  <aside id="viewer">
    <canvas id="stage" width="356" height="380" tabindex="0" aria-label="Pet viewer: drag or use arrow keys to rotate"></canvas>
    <div class="rot"><button id="rotL" aria-label="Rotate left">◀</button><span id="angleLbl">Front</span><button id="rotR" aria-label="Rotate right">▶</button></div>
    <div class="strip" id="strip"></div>
    <div class="row" id="acts"><span class="lbl">Anim</span></div>
    <div class="row"><span class="lbl">Zoom</span><span class="seg" id="zoom"></span><button id="save">Save PNG</button><button id="share" title="Copy a link to this pet, angle and animation">Copy link</button></div>
    <div id="vStatus"></div>
    <h2 id="vName"></h2>
    <div class="meta" id="vMeta"></div>
    <div id="callout"></div>
    <div class="warn" id="vWarn"></div>
    <div class="branch" id="branch"></div>
    <details open><summary>Evolution tree</summary><div class="mt" id="tree"></div></details>
    <details><summary>Stats (PETATTRIB)</summary><div id="stats"></div></details>
    <details><summary>Sprite data</summary><div id="sprite" class="meta"></div></details>
    <div class="kbd">Keys: ← → rotate · 1–5 animation · [ ] previous / next pet · drag the viewer to rotate.</div>
  </aside>
</main>
<script src="pd/colour-shift.js"></script>
<script src="pets/pets-data.js" defer></script>
<script src="pets/pets.js" defer></script>
</body>
</html>
